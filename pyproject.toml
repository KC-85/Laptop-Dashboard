[project]
name = "sysoverview"
version = "0.1.0"
description = "A terminal-based system health monitor for Linux"
readme = "README.md"
authors = [
    { name = "Kristian Cross", email = "etamin1985@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "ruff>=0.16.4",
]

[project.scripts]
sysoverview = "sysoverview:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
